[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-diagnose-v1"
version = "0.1.0"
description = "ML diagnose project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "Backend*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
